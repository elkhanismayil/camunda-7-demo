plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az.company'
version = '0.0.1-SNAPSHOT'
description = 'camunda-7-demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('camundaVersion', "7.24.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation "org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-webapp:${camundaVersion}"
    // NOTE: camunda-bpm-spring-boot-starter-rest (and with it the REST-based
    // external task client) cannot be added here - it is built on Jersey, and
    // Spring Boot 4 removed Jersey auto-configuration entirely. See the
    // external task section of the README.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // The starter, not raw spring-kafka: Spring Boot 4 moved Kafka
    // auto-configuration into its own module, so plain spring-kafka gives you
    // the framework without KafkaTemplate, @KafkaListener support or any of
    // the spring.kafka.* properties.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation "org.camunda.bpm:camunda-bpm-assert:${camundaVersion}"
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
