plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az.company'
version = '0.0.1-SNAPSHOT'
description = 'camunda-7-demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('camundaVersion', "7.24.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation "org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-webapp:${camundaVersion}"
    // NOTE: camunda-bpm-spring-boot-starter-rest (and with it the REST-based
    // external task client) cannot be added here - it is built on Jersey, and
    // Spring Boot 4 removed Jersey auto-configuration entirely. See the
    // external task section of the README.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // The starter, not raw spring-kafka: Spring Boot 4 moved Kafka
    // auto-configuration into its own module, so plain spring-kafka gives you
    // the framework without KafkaTemplate, @KafkaListener support or any of
    // the spring.kafka.* properties.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // The browser UI logs in through Keycloak's own login page, so the app needs
    // the client half of OAuth2 as well as the resource-server half. It also
    // supplies the OAuth2AuthorizedClientManager the registration flow uses to
    // fetch its own service-account token.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Explicit version because springdoc is not in the Spring Boot BOM, so nothing
    // else supplies one. The 3.x line is the one built against Boot 4 / Spring
    // Security 7; 2.x targets Boot 3 and does not start here.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    // Gives Thymeleaf the sec:authorize dialect, so a control the current user
    // may not use is never rendered rather than rendered into a 403.
    // Still artifact "6" under Spring Security 7 - that is what the Boot 4.1 BOM manages.
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation "org.camunda.bpm:camunda-bpm-assert:${camundaVersion}"
    testImplementation 'org.springframework.security:spring-security-test'
    // No version: the Spring Boot BOM manages Testcontainers. The registration
    // flow is the one path whose correctness lives in Keycloak's Admin API rather
    // than in this codebase, so it is covered against a real Keycloak.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
