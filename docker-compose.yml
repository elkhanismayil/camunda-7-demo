# Kafka broker and Keycloak for the event-driven and secured halves of the demo.
#
# Postgres is deliberately not here - see the README. Many people running this
# already have one on 5432, and a second container fighting for that port is a
# worse first experience than one extra docker run.
#
#   docker compose up -d
#
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: camunda-demo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft: this single node is both broker and controller, so there is no
      # Zookeeper to run alongside it.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The app runs on the host, so clients must be told to come back on
      # localhost - not the container hostname they would otherwise receive.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so nothing can be replicated anywhere.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: camunda-demo-keycloak
    restart: unless-stopped
    # The realm is imported from a file rather than clicked together in the
    # admin console, so the roles and users the API authorizes against are part
    # of the repository and identical on every machine.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8083
    ports:
      - "8083:8083"
    volumes:
      - ./keycloak/realm-camunda-demo.json:/opt/keycloak/data/import/realm-camunda-demo.json:ro
