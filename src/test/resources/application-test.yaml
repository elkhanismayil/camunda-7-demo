spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri rather than issuer-uri: issuer-uri performs OIDC
          # discovery at startup and would make every test require a running
          # Keycloak. This builds the decoder lazily and is never called,
          # because the tests inject pre-authenticated JWTs.
          jwk-set-uri: http://localhost:8083/realms/camunda-demo/protocol/openid-connect/certs

      client:
        registration:
          keycloak:
            # Registration id stays "keycloak", so /oauth2/authorization/keycloak
            # is byte-for-byte the production entry point. Only the provider is
            # swapped, for the reason spelled out below.
            provider: keycloak-test
        provider:
          keycloak-test:
            # Endpoints listed instead of discovered. issuer-uri fetches the OIDC
            # metadata while the context starts, so a single one here would make
            # every @SpringBootTest in this repository require a live Keycloak -
            # the same trap the resource-server block above sidesteps. None of
            # these is ever called; the tests assert on the redirect built from
            # them.
            authorization-uri: http://localhost:8083/realms/camunda-demo/protocol/openid-connect/auth
            token-uri: http://localhost:8083/realms/camunda-demo/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8083/realms/camunda-demo/protocol/openid-connect/certs
            user-info-uri: http://localhost:8083/realms/camunda-demo/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

  kafka:
    listener:
      # No broker in these tests. The listener bean still exists so the tests
      # can invoke it directly and assert on correlation, deduplication and the
      # retryable/not-retryable split without a Kafka round trip.
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:camunda-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

camunda.bpm:
  database:
    schema-update: true
  job-execution:
    enabled: false      # tests trigger timer jobs manually for deterministic assertions
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks

# InvoiceWorker is @Profile("!test"), so no polling loop competes with the
# tests for external tasks - they fetch and complete them explicitly instead.
# OutboxPublisher and KafkaConfig are excluded the same way; the outbox rows
# themselves are plain JPA writes, so they are fully testable without a broker.

demo:
  kafka:
    payment-events-topic: payment-events
    payment-events-dlt-topic: payment-events-dlt
    order-events-topic: order-events
    consumer-group: camunda-payment-correlator
