server:
  port: 8082

spring:
  application:
    name: camunda-7-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/camunda
    username: camunda
    password: camunda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    open-in-view: false

camunda.bpm:
  database:
    schema-update: true      # let Camunda create/upgrade its own tables
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks
