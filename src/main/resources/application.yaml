server:
  port: 8082

spring:
  application:
    name: camunda-7-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/camunda
    username: camunda
    password: camunda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Discovery: the app fetches the OIDC metadata once at startup and the
          # signing keys from there, so rotating keys in Keycloak needs no
          # redeploy. It also means the issuer claim is validated, not just the
          # signature - a correctly signed token from another realm is rejected.
          issuer-uri: http://localhost:8083/realms/camunda-demo

      # The browser half. The API above only ever inspects a token someone else
      # obtained; this is the client that sends the user to Keycloak to get one.
      client:
        registration:
          keycloak:
            client-id: camunda-demo-api
            client-secret: demo-client-secret
            # Authorization code, so the credential the browser carries back is
            # a single-use code that is worthless without the secret. The code
            # is exchanged for tokens server to server, and the password never
            # passes through this application at all.
            authorization-grant-type: authorization_code
            # Spelled out rather than left to the framework default, which only
            # gets filled in on the issuer-discovery path. It has to match a
            # redirectUris entry on the camunda-demo-api client in the realm
            # file, so it is worth having both halves visible and greppable.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # "openid" is what makes this OIDC rather than plain OAuth2 - it is
            # the scope that yields an ID token, and the ID token is where
            # oauth2Login reads the user and the realm roles from.
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8083/realms/camunda-demo
            # Otherwise the principal name is the Keycloak user UUID from "sub".
            # Matches setPrincipalClaimName on the API side, so the same person
            # is logged and displayed identically on both surfaces.
            user-name-attribute: preferred_username

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas. The outbox blocks on this acknowledgement
      # before marking a row published, so a weaker setting here would mean
      # "published" rows whose records were never durably stored.
      acks: all
    consumer:
      group-id: camunda-payment-correlator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Offsets are committed by the container after the listener returns, so a
      # crash mid-handling redelivers rather than silently skipping.
      enable-auto-commit: false
    listener:
      ack-mode: record

camunda.bpm:
  database:
    schema-update: true      # let Camunda create/upgrade its own tables
  job-execution:
    enabled: true
    # Threads that actually run acquired jobs. Too few starves throughput;
    # too many just moves the bottleneck onto the DB connection pool, so
    # keep max-pool-size at or below the Hikari pool size.
    core-pool-size: 3
    max-pool-size: 10
    # Jobs buffered between acquisition and execution. A large queue hides
    # backpressure and lengthens the window in which a crash abandons work.
    queue-capacity: 20
    # How many jobs one acquisition cycle locks at once. Raising it cuts
    # acquisition round-trips but increases optimistic-locking contention
    # between nodes competing for the same jobs in a cluster.
    max-jobs-per-acquisition: 3
    # How long an acquired job stays locked to this node. Must exceed the
    # slowest realistic job duration, otherwise another node picks the job
    # up while it is still running and it executes twice.
    lock-time-in-millis: 300000
    # Idle backoff between acquisition cycles when there is nothing to do.
    wait-time-in-millis: 5000
    max-wait: 60000
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks

demo:
  invoice-worker:
    # How often the external task worker asks the engine for work on its topic.
    poll-interval-ms: 2000
  outbox:
    # How often committed domain events are drained to Kafka.
    poll-interval-ms: 1000
  kafka:
    payment-events-topic: payment-events
    payment-events-dlt-topic: payment-events-dlt
    order-events-topic: order-events
    consumer-group: camunda-payment-correlator
